name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-selftest:
    # WPF 앱이라 Windows 러너가 필요하다
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build PromptAdvisor.csproj -c Release --nologo
      - name: Self-test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "pa-selftest"
          $p = Start-Process -FilePath ".\bin\Release\net9.0-windows\PromptAdvisor.exe" -ArgumentList "--selftest","--data",$data -Wait -PassThru
          Get-Content (Join-Path $data "selftest-result.txt")
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
